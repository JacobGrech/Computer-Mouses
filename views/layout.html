<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{{title}} – MyšKatalog</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --accent: #6C63FF;
      --accent-dark: #4B44CC;
      --gaming: #e63946;
      --kancelarska: #457b9d;
      --bezdratova: #2a9d8f;
      --bg: #f4f5fb;
      --card: #ffffff;
      --text: #1d1d2e;
      --muted: #6b7280;
      --border: #e2e5ef;
      --radius: 12px;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
    }

    nav {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 12px rgba(108,99,255,.25);
    }
    nav .logo {
      color: #fff;
      font-size: 1.3rem;
      font-weight: 700;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: .5rem;
    }
    nav .logo span { font-size: 1.5rem; }
    nav a.nav-link {
      color: rgba(255,255,255,.85);
      text-decoration: none;
      font-size: .95rem;
      padding: .4rem .8rem;
      border-radius: 8px;
      transition: background .2s;
    }
    nav a.nav-link:hover { background: rgba(255,255,255,.15); color: #fff; }

    .container { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; }

    h1 { font-size: 1.6rem; font-weight: 700; margin: 0 0 1.5rem; }
    h2 { font-size: 1.2rem; font-weight: 600; margin: 0 0 1rem; color: var(--accent); }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }

    /* Filtry */
    .filter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: .8rem;
      align-items: end;
    }
    .filter-group label { display: block; font-size: .8rem; font-weight: 600; color: var(--muted); margin-bottom: .3rem; text-transform: uppercase; letter-spacing: .04em; }
    .filter-group input,
    .filter-group select {
      width: 100%;
      padding: .5rem .7rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: .9rem;
      background: var(--bg);
      outline: none;
      transition: border-color .2s;
    }
    .filter-group input:focus, .filter-group select:focus { border-color: var(--accent); }
    .filter-actions { display: flex; gap: .5rem; align-items: flex-end; }

    /* Tabulka */
    table { border-collapse: collapse; width: 100%; font-size: .9rem; }
    thead tr { background: var(--bg); }
    th { padding: .75rem 1rem; text-align: left; font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); border-bottom: 2px solid var(--border); }
    td { padding: .7rem 1rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tbody tr:hover { background: #f8f8ff; }
    .empty { text-align: center; padding: 2rem; color: var(--muted); }
    td a { color: var(--accent); font-weight: 500; text-decoration: none; }
    td a:hover { text-decoration: underline; }

    /* Badges */
    .badge {
      display: inline-block;
      padding: .2rem .65rem;
      border-radius: 99px;
      font-size: .78rem;
      font-weight: 600;
    }
    .badge.gaming     { background: #fde8ea; color: var(--gaming); }
    .badge.kancelarska{ background: #deeef7; color: var(--kancelarska); }
    .badge.bezdratova { background: #d4f0ed; color: var(--bezdratova); }

    /* Tlačítka */
    .btn {
      display: inline-block;
      padding: .35rem .75rem;
      border-radius: 7px;
      font-size: .82rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      text-decoration: none;
      transition: opacity .15s, transform .1s;
    }
    .btn:hover { opacity: .85; }
    .btn:active { transform: scale(.97); }
    .btn-primary  { background: var(--accent); color: #fff; padding: .55rem 1.2rem; font-size: .9rem; }
    .btn-secondary{ background: var(--bg); color: var(--text); border: 1px solid var(--border); }
    .btn-detail   { background: #eef0ff; color: var(--accent); }
    .btn-edit     { background: #fff3e0; color: #e07b00; }
    .btn-delete   { background: #fde8ea; color: var(--gaming); }
    .actions { display: flex; gap: .4rem; flex-wrap: wrap; }

    /* Formuláře */
    .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
    .form-group { display: flex; flex-direction: column; gap: .3rem; }
    .form-group label { font-size: .82rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .form-group input, .form-group select {
      padding: .55rem .75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: .95rem;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .form-group input:focus, .form-group select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(108,99,255,.12);
    }
    .form-group input.invalid { border-color: var(--gaming); }

    .form-footer { margin-top: 1.2rem; display: flex; gap: .8rem; align-items: center; }
    .msg { font-size: .85rem; margin: 0; }
    .msg.error { color: var(--gaming); }
    .msg.success { color: var(--bezdratova); }

    /* Detail */
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .detail-item { background: var(--bg); border-radius: 8px; padding: 1rem; }
    .detail-item .label { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: .3rem; }
    .detail-item .value { font-size: 1.05rem; font-weight: 600; }

    /* Stat */
    .stat-bar { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
    .stat-pill { background: var(--accent); color: #fff; border-radius: 99px; padding: .25rem .9rem; font-size: .82rem; font-weight: 700; }

    @media (max-width: 600px) {
      .detail-grid { grid-template-columns: 1fr; }
      .filter-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <nav>
    <a class="logo" href="/"><span>🖱️</span> MyšKatalog</a>
    <a class="nav-link" href="/">← Domů</a>
  </nav>
  <div class="container">
    {{content}}
  </div>
  <script src="/public/app.js"></script>
</body>
</html>
