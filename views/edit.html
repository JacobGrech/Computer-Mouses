<h1>✏️ Editace: {{brand}} {{model}}</h1>

<div class="card">
  <form id="editForm" data-id="{{id}}">
    <div class="form-grid">
      <div class="form-group">
        <label>Značka</label>
        <input id="e-brand" name="brand" value="{{brand}}" required />
      </div>
      <div class="form-group">
        <label>Model</label>
        <input id="e-model" name="model" value="{{model}}" required />
      </div>
      <div class="form-group">
        <label>Typ</label>
        <select id="e-type" name="type">
          <option value="Gaming" {{selGaming}}>Gaming</option>
          <option value="Kancelářská" {{selKancelar}}>Kancelářská</option>
          <option value="Bezdrátová" {{selBezdrat}}>Bezdrátová</option>
        </select>
      </div>
      <div class="form-group">
        <label>DPI (100 – 100 000)</label>
        <input type="number" id="e-dpi" name="dpi" value="{{dpi}}" min="100" max="100000" required />
      </div>
      <div class="form-group">
        <label>Cena (Kč)</label>
        <input type="number" id="e-price" name="price" value="{{price}}" min="1" required />
      </div>
    </div>
    <div class="form-footer">
      <button type="submit" class="btn btn-primary">💾 Uložit změny</button>
      <a class="btn btn-secondary" href="/mouse/{{id}}">Zrušit</a>
      <p class="msg" id="editMsg"></p>
    </div>
  </form>
</div>
